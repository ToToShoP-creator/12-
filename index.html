<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCRP Lab: TikTok Ultimate Arena</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #05070c;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        /* HUD / Верхня панель рахунку */
        .hud-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 25px;
            background: rgba(10, 14, 23, 0.85);
            padding: 12px 35px;
            border-radius: 40px;
            border: 2px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 15px 35px rgba(0,0,0,0.7), inset 0 0 15px rgba(255,255,255,0.05);
            backdrop-filter: blur(12px);
            z-index: 20;
        }
        .faction-card {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .faction-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
            opacity: 0.8;
            margin-bottom: 2px;
        }
        .faction-score {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 1px;
        }
        .lab-side .faction-score, .lab-side .faction-title { color: #ff3366; text-shadow: 0 0 12px rgba(255, 51, 102, 0.6); }
        .zone-side .faction-score, .zone-side .faction-title { color: #00ff66; text-shadow: 0 0 12px rgba(0, 255, 102, 0.6); }
        
        .vs-badge {
            background: linear-gradient(135deg, #7928ca, #ff0080);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 16px;
            box-shadow: 0 0 15px rgba(255, 0, 128, 0.5);
        }

        /* Нижня панель тестування та керування */
        .test-panel {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            background: rgba(10, 14, 23, 0.92);
            padding: 15px 25px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            backdrop-filter: blur(12px);
            z-index: 20;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            background: #1f293d;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
            transition: all 0.25s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn:hover {
            transform: translateY(-3px);
            filter: brightness(1.25);
            box-shadow: 0 6px 15px rgba(0,0,0,0.5);
        }
        .btn-lab { background: linear-gradient(135deg, #ff3366, #ff6b81); }
        .btn-zone { background: linear-gradient(135deg, #00b09b, #96c93d); color: #05070c; }
        .btn-epic { background: linear-gradient(135deg, #f7b733, #fc4a1a); }

        /* Статус WebSocket */
        #ws-status {
            position: absolute;
            top: 25px;
            right: 25px;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 800;
            background: rgba(255, 51, 102, 0.15);
            color: #ff3366;
            border: 1px solid rgba(255, 51, 102, 0.4);
            backdrop-filter: blur(8px);
            z-index: 20;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }
        #ws-status.connected {
            background: rgba(0, 255, 102, 0.15);
            color: #00ff66;
            border-color: rgba(0, 255, 102, 0.4);
        }
    </style>
</head>
<body>

    <div id="ws-status">🔴 WS: Очікування підключення...</div>

    <div class="hud-container">
        <div class="faction-card lab-side">
            <span class="faction-title">СКРП Лаб</span>
            <span class="faction-score" id="scoreLab">0</span>
        </div>
        <div class="vs-badge">VS</div>
        <div class="faction-card zone-side">
            <span class="faction-title">Зона</span>
            <span class="faction-score" id="scoreZone">0</span>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div class="test-panel">
        <button class="btn btn-lab" onclick="simulateGift('СКРП Лаб', 'Троянда', 1)">🌹 Лаб: Троянда</button>
        <button class="btn btn-lab" onclick="simulateGift('СКРП Лаб', 'Лев (Епік)', 10)">🦁 Лаб: Лев</button>
        <button class="btn btn-zone" onclick="simulateGift('Зона', 'Петарда', 2)">🎇 Зона: Петарда</button>
        <button class="btn btn-zone" onclick="simulateGift('Зона', 'Троянда', 1)">🌹 Зона: Троянда</button>
        <button class="btn btn-epic" onclick="triggerMegaEvent()">⚡ МЕГА ХАОС</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Ігрові стани
        let scoreLab = 0;
        let scoreZone = 0;
        let fighters = [];
        let particles = [];
        let floatingTexts = [];
        let backgroundEffects = [];
        let screenShake = 0;

        const avatars = ['🐱', '🤖', '🦊', '🐼', '💀', '👽', '🦖', '🤠', '🥷', '🦄', '🐯', '⚡'];
        const testNames = ['Максим_Ткач', 'Олена_Зірка', 'Богдан_Кібер', 'Ірина_Світ', 'Тарас_Бджола', 'Віталік_Про', 'Катя_Мур', 'Діана_Арт', 'Скіф_99', 'Аркада_Дубно'];

        // Створення фонових часток (частинки попелу та неонові зірки)
        for (let i = 0; i < 60; i++) {
            backgroundEffects.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 3 + 1,
                speedY: (Math.random() - 0.5) * 0.5,
                speedX: (Math.random() - 0.5) * 0.5,
                alpha: Math.random() * 0.7 + 0.2
            });
        }

        // Клас Бійця (Глядача)
        class Fighter {
            constructor(name, faction, giftType = 'Троянда') {
                this.name = name;
                this.faction = faction; // 'СКРП Лаб' або 'Зона'
                this.giftType = giftType;
                
                this.isEpic = giftType.includes('Лев') || giftType.includes('Галактика');
                this.scale = this.isEpic ? 2.2 : 1;
                
                // Спавн з боків екрану
                this.x = faction === 'СКРП Лаб' ? -60 : canvas.width + 60;
                this.y = canvas.height / 2 + (Math.random() * 260 - 130);
                
                // Ціль в центрі арени з урахуванням зіткнень
                this.targetX = canvas.width / 2 + (faction === 'СКРП Лаб' ? -130 : 130) + (Math.random() * 100 - 50);
                this.speed = 3 + Math.random() * 2;
                this.avatar = avatars[Math.floor(Math.random() * avatars.length)];
                
                this.health = this.isEpic ? 400 : 120;
                this.maxHealth = this.health;
                this.bounceOffset = Math.random() * 100;
                this.state = 'walk'; // walk, battle, victory
                this.attackCooldown = 0;
            }

            update() {
                // Логіка пересування до центру
                if (this.state === 'walk') {
                    if (Math.abs(this.x - this.targetX) > 4) {
                        this.x += (this.targetX > this.x ? 1 : -1) * this.speed;
                    } else {
                        this.state = 'battle';
                    }
                } else if (this.state === 'battle') {
                    // Бійка в центрі: кумедне хитання та випадкові рухи
                    this.y += Math.sin(Date.now() * 0.01 + this.bounceOffset) * 0.6;
                    
                    // Пошук ворога для нанесення уявних ударів
                    this.attackCooldown++;
                    if (this.attackCooldown > 60) {
                        this.attackCooldown = 0;
                        // Створюємо маленьку іскру удару
                        particles.push(new Particle(this.x + (this.faction === 'СКРП Лаб' ? 20 : -20), this.y, '#fff', '💥'));
                    }
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                // Тінь під персонажем
                ctx.beginPath();
                ctx.ellipse(0, 35 * this.scale, 22 * this.scale, 8 * this.scale, 0, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fill();

                // Аура навколо епічних гравців
                if (this.isEpic) {
                    ctx.beginPath();
                    ctx.arc(0, 0, 45, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255, 215, 0, 0.2)';
                    ctx.fill();
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = '#ffd700';
                    ctx.stroke();
                }

                // Анімація стрибка / дихання
                let jump = Math.sin(Date.now() * 0.008 + this.bounceOffset) * 5;

                // Основний аватар
                ctx.font = `${38 * this.scale}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.avatar, 0, jump);

                // Корона для Левів
                if (this.isEpic) {
                    ctx.font = '24px sans-serif';
                    ctx.fillText('👑', 0, -38 * this.scale + jump);
                }

                // Смуга HP
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(-28, -52 * this.scale, 56, 6);
                ctx.fillStyle = this.faction === 'СКРП Лаб' ? '#ff3366' : '#00ff66';
                ctx.fillRect(-28, -52 * this.scale, 56 * (this.health / this.maxHealth), 6);

                // Нікнейм глядача з обведенням
                ctx.font = 'bold 13px Segoe UI';
                ctx.textAlign = 'center';
                ctx.fillStyle = '#ffffff';
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 4;
                ctx.strokeText(this.name, 0, 46 * this.scale);
                ctx.fillText(this.name, 0, 46 * this.scale);

                ctx.restore();
            }
        }

        // Клас Частинок (Вибухи, іскри, ефекти подарунків)
        class Particle {
            constructor(x, y, color, emoji = '✨') {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 12;
                this.vy = (Math.random() - 0.5) * 12 - 3;
                this.alpha = 1;
                this.color = color;
                this.emoji = emoji;
                this.size = 14 + Math.random() * 12;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.35; // гравітація
                this.alpha -= 0.02;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.font = `${this.size}px sans-serif`;
                ctx.fillText(this.emoji, this.x, this.y);
                ctx.restore();
            }
        }

        // Клас Плаваючого тексту (Сповіщення про донат)
        class FloatingText {
            constructor(text, x, y, color) {
                this.text = text;
                this.x = x;
                this.y = y;
                this.alpha = 1;
                this.color = color;
            }
            update() {
                this.y -= 1.8;
                this.alpha -= 0.015;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.font = 'bold 16px Segoe UI';
                ctx.fillStyle = this.color;
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 4;
                ctx.strokeText(this.text, this.x, this.y);
                ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }
        }

        // Обробка події донату / подарунка
        function handleGiftEvent(username, faction, giftName, count = 1) {
            const points = count * (giftName.includes('Лев') ? 25 : (giftName.includes('Петарда') ? 5 : 1));
            
            if (faction === 'СКРП Лаб') {
                scoreLab += points;
                document.getElementById('scoreLab').innerText = scoreLab;
            } else {
                scoreZone += points;
                document.getElementById('scoreZone').innerText = scoreZone;
            }

            // Пошук або створення бійця
            let fighter = fighters.find(f => f.name === username);
            if (!fighter) {
                fighter = new Fighter(username, faction, giftName);
                fighters.push(fighter);
            } else {
                if (giftName.includes('Лев')) fighter.isEpic = true;
                fighter.health = Math.min(fighter.maxHealth * 2, fighter.health + 50);
            }

            // Налаштування ефектів залежно від подарунка
            let emoji = '🌹';
            let color = '#ff3366';
            if (giftName.includes('Петарда')) { emoji = '🎇'; color = '#ff9900'; screenShake = 12; }
            if (giftName.includes('Лев')) { emoji = '🦁'; color = '#ffd700'; screenShake = 22; }

            // Спавн часток вибуху
            for (let i = 0; i < 18; i++) {
                particles.push(new Particle(fighter.x, fighter.y, color, emoji));
            }

            floatingTexts.push(new FloatingText(`+${points} (${username}: ${giftName})`, fighter.x, fighter.y - 50, color));
        }

        // Тестові симуляції для кнопок
        function simulateGift(faction, giftName, count) {
            const randomName = testNames[Math.floor(Math.random() * testNames.length)];
            handleGiftEvent(randomName, faction, giftName, count);
        }

        function triggerMegaEvent() {
            simulateGift('СКРП Лаб', 'Лев (Епік)', 10);
            setTimeout(() => simulateGift('Зона', 'Петарда', 10), 200);
            screenShake = 30;
        }

        // Рендеринг футуристичного фону арены
        function drawBackground() {
            // Градієнтне тло
            let bgGrad = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, 100, canvas.width / 2, canvas.height / 2, canvas.width);
            bgGrad.addColorStop(0, '#111827');
            bgGrad.addColorStop(1, '#030712');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Неонова сітка арени на підлозі (Cyberpunk Grid)
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1.5;
            let step = 60;
            for (let x = 0; x < canvas.width; x += step) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += step) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            // Центральна розділова лінія сили
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 3;
            ctx.setLineDash([8, 8]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 60);
            ctx.lineTo(canvas.width / 2, canvas.height - 60);
            ctx.stroke();
            ctx.setLineDash([]);

            // Оновлення фонових частинок
            backgroundEffects.forEach(p => {
                p.x += p.speedX;
                p.y += p.speedY;
                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;
                if (p.y < 0) p.y = canvas.height;
                if (p.y > canvas.height) p.y = 0;

                ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
        }

        // Головний ігровий цикл
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            // Ефект трясіння екрану (Screen Shake)
            if (screenShake > 0) {
                ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
                screenShake *= 0.88;
                if (screenShake < 0.4) screenShake = 0;
            }

            drawBackground();

            // Малювання бійців
            fighters.forEach(f => {
                f.update();
                f.draw();
            });

            // Малювання часток
            particles.forEach((p, index) => {
                p.update();
                p.draw();
                if (p.alpha <= 0) particles.splice(index, 1);
            });

            // Малювання плаваючих текстів
            floatingTexts.forEach((ft, index) => {
                ft.update();
                ft.draw();
                if (ft.alpha <= 0) floatingTexts.splice(index, 1);
            });

            ctx.restore();
            requestAnimationFrame(animate);
        }

        animate();

        // ==========================================
        // ПІДКЛЮЧЕННЯ WEBSOCKET ДО TIKTOK LIVE МОСТУ
        // ==========================================
        function connectWebSocket() {
            const wsStatus = document.getElementById('ws-status');
            const ws = new WebSocket('ws://localhost:8080'); // Порт локального мосту

            ws.onopen = () => {
                wsStatus.innerText = '🟢 WS: Підключено до TikTok Live (@scrp_lab)';
                wsStatus.classList.add('connected');
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    // Очікуваний формат від Node.js: { username: "...", faction: "СКРП Лаб", giftName: "Троянда", count: 1 }
                    if (data.username && data.giftName) {
                        const assignedFaction = data.faction || (Math.random() > 0.5 ? 'СКРП Лаб' : 'Зона');
                        handleGiftEvent(data.username, assignedFaction, data.giftName, data.count || 1);
                    }
                } catch (e) {
                    console.error('Помилка обробки WebSocket:', e);
                }
            };

            ws.onclose = () => {
                wsStatus.innerText = '🔴 WS: Перепідключення...';
                wsStatus.classList.remove('connected');
                setTimeout(connectWebSocket, 4000);
            };
        }

        // Розкоментуйте рядок нижче, коли запустите Node.js міст на ПК:
        // connectWebSocket();
    </script>
</body>
</html>
