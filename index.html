<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCRP Lab vs Zone: TikTok Ultimate War Arena (v2.0 Pro)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #02040a;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #ffffff;
        }
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* Головна верхня панель (HUD) */
        .hud-wrapper {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 25px;
            background: rgba(8, 12, 22, 0.92);
            padding: 12px 35px;
            border-radius: 40px;
            border: 2px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 15px 40px rgba(0,0,0,0.8), inset 0 0 15px rgba(255,255,255,0.05);
            backdrop-filter: blur(12px);
            z-index: 20;
        }
        .team-hud {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 140px;
        }
        .team-name {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 800;
            opacity: 0.85;
            margin-bottom: 2px;
        }
        .team-score {
            font-size: 30px;
            font-weight: 900;
            letter-spacing: 1px;
        }
        .lab-hud .team-score, .lab-hud .team-name { color: #ff3366; text-shadow: 0 0 12px rgba(255, 51, 102, 0.6); }
        .zone-hud .team-score, .zone-hud .team-name { color: #00ff66; text-shadow: 0 0 12px rgba(0, 255, 102, 0.6); }

        .vs-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .vs-badge {
            background: linear-gradient(135deg, #7928ca, #ff0080);
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 15px;
            box-shadow: 0 0 15px rgba(255, 0, 128, 0.5);
            letter-spacing: 1px;
        }
        .round-timer {
            font-size: 13px;
            font-weight: 800;
            color: #ffd700;
            margin-top: 4px;
        }

        /* Шкали супер-здібностей (Ultimate Charge Bars) */
        .ult-container {
            position: absolute;
            top: 95px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 20;
        }
        .ult-bar-wrapper {
            width: 200px;
            height: 12px;
            background: rgba(0,0,0,0.6);
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.2);
            position: relative;
        }
        .ult-bar-fill {
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }
        .ult-lab .ult-bar-fill { background: linear-gradient(90deg, #ff3366, #ff6b81); }
        .ult-zone .ult-bar-fill { background: linear-gradient(90deg, #00b09b, #96c93d); }
        .ult-text {
            position: absolute;
            width: 100%;
            text-align: center;
            top: -18px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        /* Таблиця лідерів (Leaderboard) */
        .leaderboard-box {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(10, 14, 23, 0.85);
            padding: 12px 18px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            z-index: 20;
            min-width: 200px;
        }
        .lb-title {
            font-size: 12px;
            font-weight: 800;
            color: #ffd700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .lb-item {
            font-size: 12px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            color: #ccc;
        }
        .lb-item span.val { color: #fff; font-weight: 800; }

        /* Нижня панель тестування */
        .test-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            background: rgba(8, 12, 22, 0.95);
            padding: 12px 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            backdrop-filter: blur(12px);
            z-index: 20;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 95vw;
        }
        .btn {
            background: #1e293b;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            font-size: 12px;
            transition: all 0.2s ease;
            box-shadow: 0 3px 8px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.25);
        }
        .btn-lab { background: linear-gradient(135deg, #ff3366, #ff6b81); }
        .btn-zone { background: linear-gradient(135deg, #00b09b, #96c93d); color: #02040a; }
        .btn-ult { background: linear-gradient(135deg, #a855f7, #6366f1); }
        .btn-epic { background: linear-gradient(135deg, #f59e0b, #ef4444); }

        /* Статус підключення */
        #net-status {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.4);
            backdrop-filter: blur(8px);
            z-index: 20;
        }
        #net-status.online {
            background: rgba(34, 197, 94, 0.15);
            color: #22c55e;
            border-color: rgba(34, 197, 94, 0.4);
        }

        /* Overlay перемоги */
        .victory-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(2, 4, 10, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            backdrop-filter: blur(10px);
        }
        .victory-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .victory-title {
            font-size: 52px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 10px;
            text-shadow: 0 0 30px currentColor;
        }
        .victory-subtitle {
            font-size: 20px;
            color: #ccc;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>

    <div id="net-status">🔴 WS: ТЕСТОВИЙ РЕЖИМ</div>

    <!-- Таблиця лідерів -->
    <div class="leaderboard-box">
        <div class="lb-title">👑 Топ Спонсорів</div>
        <div id="lb-list">
            <div class="lb-item"><span>1. Очікування...</span><span class="val">0</span></div>
            <div class="lb-item"><span>2. Очікування...</span><span class="val">0</span></div>
            <div class="lb-item"><span>3. Очікування...</span><span class="val">0</span></div>
        </div>
    </div>

    <!-- HUD -->
    <div class="hud-wrapper">
        <div class="team-hud lab-hud">
            <span class="team-name">🔴 СКРП Лаб</span>
            <span class="team-score" id="scoreLab">0</span>
        </div>
        <div class="vs-container">
            <div class="vs-badge">VS</div>
            <div class="round-timer" id="roundTimer">03:00</div>
        </div>
        <div class="team-hud zone-hud">
            <span class="team-name">🟢 Зона</span>
            <span class="team-score" id="scoreZone">0</span>
        </div>
    </div>

    <!-- Ультимейти -->
    <div class="ult-container">
        <div class="ult-bar-wrapper ult-lab">
            <div class="ult-text" style="color: #ff3366;">ЯДЕРНИЙ УДАР (ЛАБ)</div>
            <div class="ult-bar-fill" id="ultLabFill"></div>
        </div>
        <div class="ult-bar-wrapper ult-zone">
            <div class="ult-text" style="color: #00ff66;">ВИБУХ АНОМАЛІЇ (ЗОНА)</div>
            <div class="ult-bar-fill" id="ultZoneFill"></div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <!-- Панель для тестування -->
    <div class="test-panel">
        <button class="btn btn-lab" onclick="gameEngine.testSpawn('СКРП Лаб', 'Троянда', 'Melee')">🌹 Лаб: Воїн</button>
        <button class="btn btn-lab" onclick="gameEngine.testSpawn('СКРП Лаб', 'Петарда', 'Ranged')">🎇 Лаб: Снайпер</button>
        <button class="btn btn-lab" onclick="gameEngine.testSpawn('СКРП Лаб', 'Лев', 'Boss')">🦁 Лаб: Бос</button>
        
        <button class="btn btn-zone" onclick="gameEngine.testSpawn('Зона', 'Ромашка', 'Melee')">🌼 Зона: Воїн</button>
        <button class="btn btn-zone" onclick="gameEngine.testSpawn('Зона', 'Торт', 'Ranged')">🎂 Зона: Маг</button>
        <button class="btn btn-zone" onclick="gameEngine.testSpawn('Зона', 'Галактика', 'Boss')">🌌 Зона: Бос</button>

        <button class="btn btn-ult" onclick="gameEngine.triggerUltimate('СКРП Лаб')">💥 Ульт Лаб</button>
        <button class="btn btn-ult" onclick="gameEngine.triggerUltimate('Зона')">⚡ Ульт Зона</button>
        <button class="btn btn-epic" onclick="gameEngine.testMassChaos()">🔥 МАСОВА БИТВА</button>
    </div>

    <!-- Оверлей Перемоги -->
    <div class="victory-overlay" id="victoryOverlay">
        <div class="victory-title" id="victoryTitle">ПЕРЕМОГА!</div>
        <div class="victory-subtitle" id="victorySubtitle">Команда захопила арену</div>
    </div>

    <script>
        /* ==========================================================================
           1. SOUND MANAGER (Синтез звуків через Web Audio API без MP3)
           ========================================================================== */
        class SoundManager {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            playHit() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(120, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            }
            playShoot() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.12);
            }
            playExplosion() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(20, this.ctx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.4);
            }
        }

        /* ==========================================================================
           2. PARTICLE SYSTEM & PROJECTILES (Система часток і снарядів)
           ========================================================================== */
        class Particle {
            constructor(x, y, color, emoji = null) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.emoji = emoji;
                this.vx = (Math.random() - 0.5) * 12;
                this.vy = (Math.random() - 0.5) * 12 - 2;
                this.alpha = 1;
                this.size = emoji ? (14 + Math.random() * 10) : (3 + Math.random() * 5);
                this.decay = 0.02 + Math.random() * 0.02;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.2; // Гравітація
                this.alpha -= this.decay;
            }
            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                if (this.emoji) {
                    ctx.font = `${this.size}px sans-serif`;
                    ctx.fillText(this.emoji, this.x, this.y);
                } else {
                    ctx.fillStyle = this.color;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        class Projectile {
            constructor(x, y, target, color, damage, owner) {
                this.x = x;
                this.y = y;
                this.target = target;
                this.color = color;
                this.damage = damage;
                this.owner = owner;
                this.speed = 8;
                this.alive = true;
                this.radius = 6;
            }
            update() {
                if (!this.target || this.target.isDead) {
                    this.alive = false;
                    return;
                }
                const dx = this.target.x - this.x;
                const dy = this.target.y - this.y;
                const dist = Math.hypot(dx, dy);

                if (dist < 12) {
                    // Влучання в ціль
                    this.target.takeDamage(this.damage, this.owner);
                    this.alive = false;
                } else {
                    this.x += (dx / dist) * this.speed;
                    this.y += (dy / dist) * this.speed;
                }
            }
            draw(ctx) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.restore();
            }
        }

        class FloatingText {
            constructor(text, x, y, color) {
                this.text = text;
                this.x = x;
                this.y = y;
                this.color = color;
                this.alpha = 1;
            }
            update() {
                this.y -= 1.5;
                this.alpha -= 0.018;
            }
            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.font = 'bold 16px system-ui';
                ctx.fillStyle = this.color;
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 3;
                ctx.strokeText(this.text, this.x, this.y);
                ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }
        }

        /* ==========================================================================
           3. FIGHTER CLASS (Повноцінний юніт з штучним інтелектом та боєм)
           ========================================================================== */
        const AVATARS = ['🐱', '🤖', '🦊', '🐼', '💀', '👽', '🦖', '🤠', '🥷', '🦄', '🐯', '⚡', '🧙‍♂️', '🦹‍♂️'];

        class Fighter {
            constructor(username, faction, giftName, unitType, game) {
                this.username = username;
                this.faction = faction; // 'СКРП Лаб' або 'Зона'
                this.giftName = giftName;
                this.unitType = unitType; // 'Melee', 'Ranged', 'Boss'
                this.game = game;

                this.isBoss = unitType === 'Boss';
                this.isRanged = unitType === 'Ranged';
                
                this.scale = this.isBoss ? 2.3 : (this.isRanged ? 1.3 : 1.0);
                
                // Початкова позиція біля своєї бази
                this.x = faction === 'СКРП Лаб' ? 100 : game.canvas.width - 100;
                this.y = game.canvas.height / 2 + (Math.random() * 280 - 140);
                
                this.avatar = AVATARS[Math.floor(Math.random() * AVATARS.length)];
                
                // Характеристики залежно від типу
                if (this.isBoss) {
                    this.maxHp = 600;
                    this.damage = 35;
                    this.speed = 1.6;
                    this.attackRange = 50;
                    this.attackInterval = 60; // Кадрів
                } else if (this.isRanged) {
                    this.maxHp = 120;
                    this.damage = 18;
                    this.speed = 2.2;
                    this.attackRange = 240;
                    this.attackInterval = 75;
                } else { // Melee
                    this.maxHp = 180;
                    this.damage = 12;
                    this.speed = 2.8;
                    this.attackRange = 35;
                    this.attackInterval = 45;
                }

                this.hp = this.maxHp;
                this.isDead = false;
                this.attackCooldown = 0;
                this.bounceSeed = Math.random() * 100;
                this.vx = 0;
                this.vy = 0;
            }

            update() {
                if (this.isDead) return;

                if (this.attackCooldown > 0) this.attackCooldown--;

                // Пошук найближчого ворога
                const enemies = this.faction === 'СКРП Лаб' ? this.game.zoneFighters : this.game.labFighters;
                let closestEnemy = null;
                let minDist = Infinity;

                for (let enemy of enemies) {
                    if (enemy.isDead) continue;
                    const d = Math.hypot(enemy.x - this.x, enemy.y - this.y);
                    if (d < minDist) {
                        minDist = d;
                        closestEnemy = enemy;
                    }
                }

                if (closestEnemy) {
                    // Якщо ворог у зоні досяжності атаки
                    if (minDist <= this.attackRange) {
                        if (this.attackCooldown <= 0) {
                            this.attack(closestEnemy);
                            this.attackCooldown = this.attackInterval;
                        }
                    } else {
                        // Рух до ворога
                        const dx = closestEnemy.x - this.x;
                        const dy = closestEnemy.y - this.y;
                        this.x += (dx / minDist) * this.speed;
                        this.y += (dy / minDist) * this.speed;
                    }
                } else {
                    // Якщо ворогів немає — рух до центру/бази ворога
                    const targetX = this.faction === 'СКРП Лаб' ? this.game.canvas.width / 2 + 100 : this.game.canvas.width / 2 - 100;
                    if (Math.abs(this.x - targetX) > 10) {
                        this.x += (targetX > this.x ? 1 : -1) * this.speed;
                    }
                }

                // Анімація хитання при русі
                this.bounceY = Math.sin(Date.now() * 0.008 + this.bounceSeed) * 5;
            }

            attack(target) {
                if (this.isRanged) {
                    // Постріл снарядом
                    const color = this.faction === 'СКРП Лаб' ? '#ff3366' : '#00ff66';
                    this.game.projectiles.push(new Projectile(this.x, this.y, target, color, this.damage, this));
                    this.game.sounds.playShoot();
                } else {
                    // Ближній бій
                    target.takeDamage(this.damage, this);
                    this.game.sounds.playHit();
                    // Спавн іскор від удару
                    for (let i = 0; i < 4; i++) {
                        this.game.particles.push(new Particle((this.x + target.x) / 2, (this.y + target.y) / 2, '#fff'));
                    }
                }
            }

            takeDamage(amount, attacker) {
                this.hp -= amount;
                this.game.floatingTexts.push(new FloatingText(`-${amount}`, this.x, this.y - 20, '#ff4757'));

                if (this.hp <= 0 && !this.isDead) {
                    this.isDead = true;
                    this.game.sounds.playExplosion();
                    
                    // Вибух при смерті
                    const color = this.faction === 'СКРП Лаб' ? '#ff3366' : '#00ff66';
                    for (let i = 0; i < (this.isBoss ? 25 : 10); i++) {
                        this.game.particles.push(new Particle(this.x, this.y, color, this.isBoss ? '💥' : '✨'));
                    }

                    // Додавання балів нападнику
                    if (attacker && attacker.faction === 'СКРП Лаб') {
                        this.game.scoreLab += this.isBoss ? 50 : 10;
                    } else if (attacker) {
                        this.game.scoreZone += this.isBoss ? 50 : 10;
                    }
                    this.game.updateHUD();
                }
            }

            draw(ctx) {
                if (this.isDead) return;

                ctx.save();
                ctx.translate(this.x, this.y);

                // Тінь
                ctx.beginPath();
                ctx.ellipse(0, 32 * this.scale, 20 * this.scale, 8 * this.scale, 0, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fill();

                // Сяюча аура для Босів
                if (this.isBoss) {
                    ctx.beginPath();
                    ctx.arc(0, 0, 42 * this.scale, 0, Math.PI * 2);
                    ctx.fillStyle = this.faction === 'СКРП Лаб' ? 'rgba(255, 51, 102, 0.2)' : 'rgba(0, 255, 102, 0.2)';
                    ctx.fill();
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = this.faction === 'СКРП Лаб' ? '#ff3366' : '#00ff66';
                    ctx.stroke();
                }

                // Аватар
                ctx.font = `${36 * this.scale}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.avatar, 0, this.bounceY);

                // Корона для босів
                if (this.isBoss) {
                    ctx.font = '22px sans-serif';
                    ctx.fillText('👑', 0, -38 * this.scale + this.bounceY);
                }

                // Смуга HP
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(-26, -46 * this.scale, 52, 6);
                ctx.fillStyle = this.faction === 'СКРП Лаб' ? '#ff3366' : '#00ff66';
                ctx.fillRect(-26, -46 * this.scale, 52 * Math.max(0, this.hp / this.maxHp), 6);

                // Нікнейм
                ctx.font = 'bold 12px system-ui';
                ctx.textAlign = 'center';
                ctx.fillStyle = '#ffffff';
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 3;
                ctx.strokeText(this.username, 0, 42 * this.scale);
                ctx.fillText(this.username, 0, 42 * this.scale);

                ctx.restore();
            }
        }

        /* ==========================================================================
           4. GAME ENGINE (Головне ігрове ядро)
           ========================================================================== */
        class GameEngine {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.sounds = new SoundManager();

                this.labFighters = [];
                this.zoneFighters = [];
                this.projectiles = [];
                this.particles = [];
                this.floatingTexts = [];
                
                this.scoreLab = 0;
                this.scoreZone = 0;
                this.ultLab = 0;
                this.ultZone = 0;

                this.leaderboard = new Map(); // username -> totalSpent
                this.screenShake = 0;
                this.roundTimeLeft = 180; // 3 хвилини раунд

                this.resize();
                window.addEventListener('resize', () => this.resize());

                this.initTimer();
            }

            resize() {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
            }

            initTimer() {
                setInterval(() => {
                    if (this.roundTimeLeft > 0) {
                        this.roundTimeLeft--;
                        const m = Math.floor(this.roundTimeLeft / 60).toString().padStart(2, '0');
                        const s = (this.roundTimeLeft % 60).toString().padStart(2, '0');
                        document.getElementById('roundTimer').innerText = `${m}:${s}`;
                    } else {
                        this.endRound();
                    }
                }, 1000);
            }

            spawnFighter(username, faction, giftName, unitType) {
                this.sounds.init();
                const fighter = new Fighter(username, faction, giftName, unitType, this);
                if (faction === 'СКРП Лаб') {
                    this.labFighters.push(fighter);
                    this.scoreLab += unitType === 'Boss' ? 50 : 10;
                    this.ultLab = Math.min(100, this.ultLab + (unitType === 'Boss' ? 30 : 8));
                } else {
                    this.zoneFighters.push(fighter);
                    this.scoreZone += unitType === 'Boss' ? 50 : 10;
                    this.ultZone = Math.min(100, this.ultZone + (unitType === 'Boss' ? 30 : 8));
                }

                // Оновлення таблиці лідерів
                const current = this.leaderboard.get(username) || 0;
                const addVal = unitType === 'Boss' ? 100 : (unitType === 'Ranged' ? 20 : 5);
                this.leaderboard.set(username, current + addVal);

                this.updateHUD();
                this.updateLeaderboardUI();
            }

            triggerUltimate(faction) {
                this.sounds.init();
                this.sounds.playExplosion();
                this.screenShake = 35;

                if (faction === 'СКРП Лаб') {
                    this.ultLab = 0;
                    // Очищення частини ворожої армії ядерним ударом
                    this.zoneFighters.forEach(f => f.takeDamage(150, null));
                    for (let i = 0; i < 40; i++) {
                        this.particles.push(new Particle(this.canvas.width * 0.7, this.canvas.height / 2, '#ff3366', '💥'));
                    }
                } else {
                    this.ultZone = 0;
                    this.labFighters.forEach(f => f.takeDamage(150, null));
                    for (let i = 0; i < 40; i++) {
                        this.particles.push(new Particle(this.canvas.width * 0.3, this.canvas.height / 2, '#00ff66', '⚡'));
                    }
                }
                this.updateHUD();
            }

            updateHUD() {
                document.getElementById('scoreLab').innerText = this.scoreLab;
                document.getElementById('scoreZone').innerText = this.scoreZone;
                document.getElementById('ultLabFill').style.width = `${this.ultLab}%`;
                document.getElementById('ultZoneFill').style.width = `${this.ultZone}%`;
            }

            updateLeaderboardUI() {
                const sorted = [...this.leaderboard.entries()].sort((a, b) => b[1] - a[1]).slice(0, 3);
                const lbList = document.getElementById('lb-list');
                lbList.innerHTML = '';
                
                sorted.forEach((item, index) => {
                    const div = document.createElement('div');
                    div.className = 'lb-item';
                    div.innerHTML = `<span>${index + 1}. ${item[0]}</span><span class="val">${item[1]}</span>`;
                    lbList.appendChild(div);
                });
            }

            endRound() {
                const winner = this.scoreLab > this.scoreZone ? 'СКРП Лаб' : (this.scoreZone > this.scoreLab ? 'Зона' : 'Нічия');
                const overlay = document.getElementById('victoryOverlay');
                const title = document.getElementById('victoryTitle');
                const subtitle = document.getElementById('victorySubtitle');

                title.innerText = winner === 'Нічия' ? 'НІЧИЯ!' : `ПЕРЕМОГА ${winner.toUpperCase()}!`;
                title.style.color = winner === 'СКРП Лаб' ? '#ff3366' : '#00ff66';
                subtitle.innerText = `Раунд завершено! Новий раунд через 5 секунд...`;
                
                overlay.classList.add('active');

                setTimeout(() => {
                    overlay.classList.remove('active');
                    this.scoreLab = 0;
                    this.scoreZone = 0;
                    this.labFighters = [];
                    this.zoneFighters = [];
                    this.roundTimeLeft = 180;
                    this.updateHUD();
                }, 5000);
            }

            // Методи для кнопок перевірки
            testSpawn(faction, giftName, unitType) {
                const names = ['Ткач_Дубно', 'Кібер_Скіф', 'Діана_Арт', 'Олена_Star', 'Макс_Pro'];
                const randomName = names[Math.floor(Math.random() * names.length)];
                this.spawnFighter(randomName, faction, giftName, unitType);
            }

            testMassChaos() {
                for (let i = 0; i < 5; i++) {
                    this.testSpawn('СКРП Лаб', 'Троянда', 'Melee');
                    this.testSpawn('Зона', 'Ромашка', 'Melee');
                }
                this.testSpawn('СКРП Лаб', 'Лев', 'Boss');
                this.testSpawn('Зона', 'Галактика', 'Boss');
            }

            drawBackground() {
                // Футуристичний фон
                let bgGrad = this.ctx.createRadialGradient(this.canvas.width / 2, this.canvas.height / 2, 100, this.canvas.width / 2, this.canvas.height / 2, this.canvas.width);
                bgGrad.addColorStop(0, '#090d16');
                bgGrad.addColorStop(1, '#02040a');
                this.ctx.fillStyle = bgGrad;
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

                // Арена
                this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
                this.ctx.lineWidth = 2;
                for (let x = 0; x < this.canvas.width; x += 60) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(x, 0);
                    this.ctx.lineTo(x, this.canvas.height);
                    this.ctx.stroke();
                }

                // Лінія розділу
                this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
                this.ctx.setLineDash([8, 8]);
                this.ctx.beginPath();
                this.ctx.moveTo(this.canvas.width / 2, 0);
                this.ctx.lineTo(this.canvas.width / 2, this.canvas.height);
                this.ctx.stroke();
                this.ctx.setLineDash([]);
            }

            render() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

                this.ctx.save();
                if (this.screenShake > 0) {
                    this.ctx.translate((Math.random() - 0.5) * this.screenShake, (Math.random() - 0.5) * this.screenShake);
                    this.screenShake *= 0.88;
                    if (this.screenShake < 0.5) this.screenShake = 0;
                }

                this.drawBackground();

                // Оновлення та рендер юнітів
                this.labFighters = this.labFighters.filter(f => !f.isDead);
                this.zoneFighters = this.zoneFighters.filter(f => !f.isDead);

                this.labFighters.forEach(f => { f.update(); f.draw(this.ctx); });
                this.zoneFighters.forEach(f => { f.update(); f.draw(this.ctx); });

                // Оновлення та рендер снарядів
                this.projectiles = this.projectiles.filter(p => p.alive);
                this.projectiles.forEach(p => { p.update(); p.draw(this.ctx); });

                // Оновлення та рендер часток
                this.particles = this.particles.filter(p => p.alpha > 0);
                this.particles.forEach(p => { p.update(); p.draw(this.ctx); });

                // Оновлення тексту
                this.floatingTexts = this.floatingTexts.filter(ft => ft.alpha > 0);
                this.floatingTexts.forEach(ft => { ft.update(); ft.draw(this.ctx); });

                this.ctx.restore();

                requestAnimationFrame(() => this.render());
            }
        }

        // Запуск гри
        const gameEngine = new GameEngine();
        gameEngine.render();

        /* ==========================================================================
           5. WEBSOCKET BRIDGE (Зв'язок з TikTok Live Connector)
           ========================================================================== */
        function connectWebSocket() {
            const netStatus = document.getElementById('net-status');
            const ws = new WebSocket('ws://localhost:8080');

            ws.onopen = () => {
                netStatus.innerText = '🟢 WS: ПІДКЛЮЧЕНО ДО TIKTOK';
                netStatus.classList.add('online');
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    // Формат даних: { username: "...", giftName: "Троянда", faction: "СКРП Лаб" }
                    if (data.username && data.giftName) {
                        const faction = data.faction || (Math.random() > 0.5 ? 'СКРП Лаб' : 'Зона');
                        
                        let unitType = 'Melee';
                        if (data.giftName.includes('Петарда') || data.giftName.includes('Торт')) unitType = 'Ranged';
                        if (data.giftName.includes('Лев') || data.giftName.includes('Галактика')) unitType = 'Boss';

                        gameEngine.spawnFighter(data.username, faction, data.giftName, unitType);
                    }
                } catch (e) {
                    console.error('WS error:', e);
                }
            };

            ws.onclose = () => {
                netStatus.innerText = '🔴 WS: ТЕСТОВИЙ РЕЖИМ';
                netStatus.classList.remove('online');
                setTimeout(connectWebSocket, 4000);
            };
        }

        // Автоматичне підключення до локального мосту при наявності
        connectWebSocket();
    </script>
</body>
